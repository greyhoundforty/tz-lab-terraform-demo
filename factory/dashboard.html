<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Software Factory</title>
  <style>
    :root {
      --bg: #f6f4ef;
      --ink: #1a1a1a;
      --muted: #5c5c5c;
      --line: #d9d4c8;
      --card: #fffdf8;
      --ok: #1f6b3a;
      --ok-bg: #e4f2e8;
      --changes: #8a4b12;
      --changes-bg: #f8ead8;
      --pending: #6b6570;
      --pending-bg: #eceaef;
      --human: #8b1e2d;
      --human-bg: #f8e4e7;
      --merged: #245b8a;
      --accent: #2c3d4f;
    }

    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "IBM Plex Sans", "Source Sans 3", "Segoe UI", sans-serif;
      background:
        radial-gradient(ellipse 80% 50% at 10% -10%, #e8e2d4 0%, transparent 55%),
        var(--bg);
      color: var(--ink);
      min-height: 100vh;
    }

    header {
      padding: 1.5rem 1.75rem 0.75rem;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      flex-wrap: wrap;
    }
    header h1 {
      margin: 0;
      font-size: 1.35rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }
    header p {
      margin: 0.25rem 0 0;
      color: var(--muted);
      font-size: 0.9rem;
    }
    .meta {
      font-size: 0.8rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }

    .board {
      display: grid;
      grid-template-columns: repeat(6, minmax(140px, 1fr));
      gap: 0.75rem;
      padding: 1rem 1.75rem 2rem;
      overflow-x: auto;
    }

    .col {
      min-width: 160px;
      background: transparent;
    }
    .col h2 {
      margin: 0 0 0.6rem;
      font-size: 0.72rem;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: var(--muted);
      padding-bottom: 0.4rem;
      border-bottom: 1px solid var(--line);
    }
    .col.human h2 { color: var(--human); }

    .card {
      background: var(--card);
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 0.75rem;
      margin-bottom: 0.6rem;
      cursor: pointer;
      text-align: left;
      width: 100%;
      font: inherit;
      color: inherit;
      transition: border-color 0.15s, transform 0.15s;
    }
    .card:hover { border-color: var(--accent); transform: translateY(-1px); }
    .card.selected { border-color: var(--accent); box-shadow: 0 0 0 1px var(--accent); }
    .card.needs-human {
      border-color: #e0a8b0;
      background: var(--human-bg);
    }

    .card .id {
      font-size: 0.72rem;
      color: var(--muted);
      font-variant-numeric: tabular-nums;
    }
    .card .title {
      margin: 0.25rem 0 0.5rem;
      font-size: 0.92rem;
      font-weight: 600;
      line-height: 1.3;
    }
    .card .branch {
      font-size: 0.72rem;
      color: var(--muted);
      word-break: break-all;
    }

    .chips {
      display: flex;
      flex-wrap: wrap;
      gap: 0.3rem;
      margin-top: 0.55rem;
    }
    .chip {
      font-size: 0.65rem;
      font-weight: 600;
      letter-spacing: 0.02em;
      padding: 0.15rem 0.4rem;
      border-radius: 3px;
      text-transform: uppercase;
    }
    .chip.PASS { color: var(--ok); background: var(--ok-bg); }
    .chip.CHANGES { color: var(--changes); background: var(--changes-bg); }
    .chip.pending { color: var(--pending); background: var(--pending-bg); }
    .round-label {
      font-size: 0.68rem;
      color: var(--muted);
      margin-top: 0.45rem;
    }

    .empty {
      font-size: 0.8rem;
      color: var(--muted);
      padding: 0.5rem 0;
    }

    .drawer {
      position: fixed;
      top: 0;
      right: 0;
      width: min(480px, 100%);
      height: 100%;
      background: var(--card);
      border-left: 1px solid var(--line);
      box-shadow: -8px 0 24px rgba(0,0,0,0.06);
      transform: translateX(100%);
      transition: transform 0.2s ease;
      z-index: 20;
      display: flex;
      flex-direction: column;
    }
    .drawer.open { transform: translateX(0); }
    .drawer header {
      padding: 1rem 1.1rem;
      border-bottom: 1px solid var(--line);
    }
    .drawer .tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.35rem;
      padding: 0.75rem 1.1rem;
      border-bottom: 1px solid var(--line);
    }
    .drawer .tabs button {
      font: inherit;
      font-size: 0.75rem;
      border: 1px solid var(--line);
      background: transparent;
      border-radius: 4px;
      padding: 0.25rem 0.5rem;
      cursor: pointer;
      color: var(--muted);
    }
    .drawer .tabs button.active {
      color: var(--ink);
      border-color: var(--accent);
      background: #eef2f5;
    }
    .drawer .body {
      flex: 1;
      overflow: auto;
      padding: 1rem 1.1rem 2rem;
    }
    .drawer pre {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-word;
      font-family: "IBM Plex Mono", "Source Code Pro", ui-monospace, monospace;
      font-size: 0.8rem;
      line-height: 1.45;
    }
    .backdrop {
      position: fixed;
      inset: 0;
      background: rgba(26,26,26,0.25);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 15;
    }
    .backdrop.open { opacity: 1; pointer-events: auto; }
    .close {
      font: inherit;
      border: none;
      background: transparent;
      cursor: pointer;
      color: var(--muted);
      font-size: 1.2rem;
      line-height: 1;
    }

    @media (max-width: 900px) {
      .board { grid-template-columns: repeat(3, minmax(150px, 1fr)); }
    }
  </style>
</head>
<body>
  <header>
    <div>
      <h1>Software Factory</h1>
      <p>Jobs move through the loop. Click a card to read its files.</p>
    </div>
    <div class="meta" id="status">Loading…</div>
  </header>

  <div class="board" id="board"></div>

  <div class="backdrop" id="backdrop"></div>
  <aside class="drawer" id="drawer" aria-hidden="true">
    <header>
      <div style="display:flex;justify-content:space-between;align-items:flex-start;width:100%">
        <div>
          <h1 id="drawer-title" style="font-size:1.05rem">Job</h1>
          <p id="drawer-sub"></p>
        </div>
        <button class="close" id="close" aria-label="Close">×</button>
      </div>
    </header>
    <div class="tabs" id="tabs"></div>
    <div class="body"><pre id="content">Select a file</pre></div>
  </aside>

  <script>
    const STAGES = ["spec", "build", "review", "approve", "merged", "needs-human"];
    const STAGE_LABELS = {
      spec: "Spec",
      build: "Build",
      review: "Review",
      approve: "Approve",
      merged: "Merged",
      "needs-human": "Needs human"
    };
    const REVIEWERS = ["security", "ux", "ui", "code"];

    const boardEl = document.getElementById("board");
    const statusEl = document.getElementById("status");
    const drawer = document.getElementById("drawer");
    const backdrop = document.getElementById("backdrop");
    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");
    const drawerTitle = document.getElementById("drawer-title");
    const drawerSub = document.getElementById("drawer-sub");

    let jobs = [];
    let selectedId = null;

    function escapeHtml(s) {
      return String(s)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function chip(name, verdict) {
      const v = verdict || "pending";
      return `<span class="chip ${escapeHtml(v)}">${escapeHtml(name)} · ${escapeHtml(v)}</span>`;
    }

    function render() {
      const byStage = Object.fromEntries(STAGES.map(s => [s, []]));
      for (const job of jobs) {
        const stage = byStage[job.stage] ? job.stage : "needs-human";
        byStage[stage].push(job);
      }

      boardEl.innerHTML = STAGES.map(stage => {
        const list = byStage[stage];
        const cards = list.length
          ? list.map(job => {
              const reviews = job.reviews || {};
              const chips = REVIEWERS.map(r => chip(r, reviews[r])).join("");
              const human = job.stage === "needs-human" ? " needs-human" : "";
              const sel = job.id === selectedId ? " selected" : "";
              return `
                <button class="card${human}${sel}" data-id="${escapeHtml(job.id)}">
                  <div class="id">${escapeHtml(job.id)}</div>
                  <div class="title">${escapeHtml(job.title || job.id)}</div>
                  <div class="branch">${escapeHtml(job.branch || "")}</div>
                  ${job.stage === "review" || job.reviews ? `
                    <div class="round-label">Round ${escapeHtml(job.round ?? 1)}</div>
                    <div class="chips">${chips}</div>
                  ` : ""}
                </button>`;
            }).join("")
          : `<div class="empty">—</div>`;
        return `
          <section class="col${stage === "needs-human" ? " human" : ""}">
            <h2>${STAGE_LABELS[stage]}</h2>
            ${cards}
          </section>`;
      }).join("");

      boardEl.querySelectorAll(".card").forEach(btn => {
        btn.addEventListener("click", () => openJob(btn.dataset.id));
      });
    }

    async function fetchText(path) {
      const res = await fetch(path + "?t=" + Date.now());
      if (!res.ok) throw new Error(res.status + " " + path);
      return res.text();
    }

    async function openJob(id) {
      selectedId = id;
      render();
      const job = jobs.find(j => j.id === id);
      if (!job) return;

      drawerTitle.textContent = job.title || job.id;
      drawerSub.textContent = `${job.id} · ${job.stage}` + (job.round ? ` · round ${job.round}` : "");
      drawer.classList.add("open");
      backdrop.classList.add("open");
      drawer.setAttribute("aria-hidden", "false");

      const base = `jobs/${job.id}`;
      const candidates = [
        ["spec.md", `${base}/spec.md`],
        ["build.md", `${base}/build.md`],
        ["decision.md", `${base}/decision.md`],
        ["rework.md", `${base}/rework.md`]
      ];
      const maxRound = Math.max(Number(job.round) || 1, 2);
      for (let r = 1; r <= maxRound; r++) {
        for (const name of ["security", "ux", "ui", "code"]) {
          candidates.push([`round-${r}/review-${name}.md`, `${base}/round-${r}/review-${name}.md`]);
        }
      }

      const available = [];
      await Promise.all(candidates.map(async ([label, path]) => {
        try {
          const text = await fetchText(path);
          available.push({ label, path, text });
        } catch (_) { /* missing file */ }
      }));

      available.sort((a, b) => a.label.localeCompare(b.label));

      if (!available.length) {
        tabsEl.innerHTML = "";
        contentEl.textContent = "No markdown files found for this job.";
        return;
      }

      let active = available[0].label;
      const show = (label) => {
        active = label;
        tabsEl.querySelectorAll("button").forEach(b => {
          b.classList.toggle("active", b.dataset.label === label);
        });
        const file = available.find(f => f.label === label);
        contentEl.textContent = file ? file.text : "";
      };

      tabsEl.innerHTML = available.map(f =>
        `<button type="button" data-label="${escapeHtml(f.label)}">${escapeHtml(f.label)}</button>`
      ).join("");
      tabsEl.querySelectorAll("button").forEach(b => {
        b.addEventListener("click", () => show(b.dataset.label));
      });
      show(active);
    }

    function closeDrawer() {
      drawer.classList.remove("open");
      backdrop.classList.remove("open");
      drawer.setAttribute("aria-hidden", "true");
      selectedId = null;
      render();
    }

    document.getElementById("close").addEventListener("click", closeDrawer);
    backdrop.addEventListener("click", closeDrawer);
    document.addEventListener("keydown", (e) => {
      if (e.key === "Escape") closeDrawer();
    });

    async function poll() {
      try {
        const res = await fetch("board.json?t=" + Date.now());
        if (!res.ok) throw new Error("board.json " + res.status);
        const data = await res.json();
        jobs = data.jobs || [];
        statusEl.textContent = `${jobs.length} job${jobs.length === 1 ? "" : "s"} · updated ${new Date().toLocaleTimeString()}`;
        render();
      } catch (err) {
        statusEl.textContent = "Cannot load board.json — serve from factory/ with python3 -m http.server";
        console.error(err);
      }
    }

    poll();
    setInterval(poll, 2000);
  </script>
</body>
</html>
